<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Backlog Trophy Challenge</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        position: relative;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('calculator-Dateien/header.png') center/cover no-repeat fixed;
        opacity: 0.1; 
        z-index: -1; 
    }

    table {
        margin: 0 auto;
        border-collapse: collapse;
    }

    td, th {
        border: 1px solid black;
        padding: 6px 10px;
    }

    #results {
        display: none;
        margin-top: 20px;
    }

    #message {
        color: red;
        font-weight: bold;
        margin-top: 10px;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .form-row {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 6px 0;
        flex-wrap: wrap;
    }

    .form-row label {
        margin-right: 10px;
        min-width: 60px;
        text-align: right;
    }

    .form-row input {
        text-align: center;
        width: 80px;
    }

    @media (max-width: 480px) {
        .form-row {
            flex-direction: column;
            align-items: center;
        }
        .form-row label {
            text-align: center;
            margin-right: 0;
            margin-bottom: 4px;
        }
    }

    #buttons {
        margin-top: 10px;
    }

</style>
</head>
<body>
<h1>🎮 ABC-Challenge</h1>
<p style="font-size:1.2em; font-style:italic; margin-top:-10px;">Autumn Backlog Challenge</p>
<p><b>Zeitraum:</b> 01.11.2025 (00:00 Uhr MEZ) – 30.11.2025 (23:59 Uhr MEZ)</p>

<div style="color:orangered;">Counter: <span id="counter">Event beendet!</span></div>

<h2>Eingabe Trophäen</h2>

<form id="trophyForm" onsubmit="return false;">
    <div class="form-row">
        <label for="bronze">Bronze</label>
        <input type="number" id="bronze" min="0" value="0">
    </div>
    <div class="form-row">
        <label for="silver">Silber</label>
        <input type="number" id="silver" min="0" value="0">
    </div>
    <div class="form-row">
        <label for="gold">Gold</label>
        <input type="number" id="gold" min="0" value="0">
    </div>
    <div class="form-row">
        <label for="platinum">Platin</label>
        <input type="number" id="platinum" min="0" value="0">
    </div>
    <div class="form-row">
        <label for="year">Letzte Trophäe (Jahr)</label>
        <input type="number" id="year" min="2009" max="2025" value="2023">
    </div>

    <div id="buttons">
        <input type="button" value="Berechnen" id="calc">
        <input type="button" value="Zurücksetzen" id="resetBtn">
    </div>
</form>

<div id="message"></div>

<div id="results">
    <h2>Auswertung</h2>
    <table>
        <tr><td>Bronze</td><td><span id="bronzePts"></span></td></tr>
        <tr><td>Silber</td><td><span id="silverPts"></span></td></tr>
        <tr><td>Gold</td><td><span id="goldPts"></span></td></tr>
        <tr><td>Platin</td><td><span id="platinumPts"></span></td></tr>
        <tr><td><b>Gesamtpunkte (ohne Bonus)</b></td><td><span id="total"></span></td></tr>
        <tr><td>Bonusfaktor</td><td><span id="bonusFactor"></span></td></tr>
        <tr><td><b>Endpunktzahl (mit Bonus)</b></td><td><span id="finalPts"></span></td></tr>
    </table>
</div>
<br>

<script>
document.getElementById("calc").addEventListener("click", calcPoints);
document.getElementById("resetBtn").addEventListener("click", resetForm);

function resetForm() {
    const form = document.getElementById("trophyForm");
    form.reset();
    document.getElementById("year").value = 2023;
    document.getElementById("results").style.display = "none"; 
    document.getElementById("message").textContent = "";
}

function calcPoints() {
    const b = parseInt(document.getElementById("bronze").value) || 0;
    const s = parseInt(document.getElementById("silver").value) || 0;
    const g = parseInt(document.getElementById("gold").value) || 0;
    const p = parseInt(document.getElementById("platinum").value) || 0;
    const year = parseInt(document.getElementById("year").value);
    const messageBox = document.getElementById("message");

    if (year >= 2024) {
        messageBox.textContent = "❌ Dieses Spiel ist nicht gültig (zu neu).";
        document.getElementById("results").style.display = "none";
        return;
    } else {
        messageBox.textContent = "";
    }

    const bronzePts = b * 15;
    const silverPts = s * 30;
    const goldPts = g * 90;
    const platinumPts = p * 300;
    const total = bronzePts + silverPts + goldPts + platinumPts;

    document.getElementById("bronzePts").textContent = bronzePts;
    document.getElementById("silverPts").textContent = silverPts;
    document.getElementById("goldPts").textContent = goldPts;
    document.getElementById("platinumPts").textContent = platinumPts;
    document.getElementById("total").textContent = total;

    let bonusFactor = 1.0;
    if (year && year < 2023) {
        const diff = 2023 - year;
        const steps = Math.floor(diff / 2);
        bonusFactor += steps * 0.1;
    }

    document.getElementById("bonusFactor").textContent = bonusFactor.toFixed(1) + "x";
    document.getElementById("finalPts").textContent = (total * bonusFactor).toFixed(2);

    document.getElementById("results").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    document.body.style.zoom = "100%";
}

const countDownDate = new Date("Nov 30, 2025 23:59:59").getTime();
const timer = setInterval(() => {
    const now = new Date().getTime();
    const distance = countDownDate - now;

    if (distance < 0) {
        clearInterval(timer);
        document.getElementById("counter").textContent = "Event beendet!";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("counter").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}, 1000);
</script>

</body>
</html>
